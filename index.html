<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outils B27</title>

<!-- Le portail se transmet par son lien. Il n'a pas vocation à être trouvé
     par un moteur de recherche tant que la décision de l'ouvrir au monde
     n'est pas prise : robots.txt porte la même consigne côté serveur. -->
<meta name="robots" content="noindex, nofollow">

<meta name="description" content="Le portail des outils et ressources du bureau d'études B27.">
<meta property="og:type" content="website">
<meta property="og:title" content="Outils B27">
<meta property="og:description" content="Le portail des outils et ressources du bureau d'études B27.">

<link rel="icon" href="logo-b27.svg">
<link rel="stylesheet" href="hub.css">

<!-- Thème posé avant le premier rendu, sombre par défaut : c'est l'identité
     du portail, pas un réglage du poste. La préférence enregistrée gagne. -->
<script>try{var t=localStorage.getItem('hub_b27_theme');document.documentElement.dataset.theme=t||'dark';}catch(e){document.documentElement.dataset.theme='dark';}</script>
</head>

<body>

<!-- Fond animé : un champ d'écoulement calculé en local, des lignes de flux
     comme de l'air ou de l'eau en mouvement. C'est le métier du bureau
     d'études, en fond de page. Dessiné par hub.js, immobile si le poste
     demande moins d'animations. -->
<canvas id="fond" aria-hidden="true"></canvas>

<div class="haut noprint">
  <button type="button" class="bouton-icone" id="btnTheme" aria-label="Changer de thème"></button>
  <button type="button" class="bouton-icone" id="btnApropos" data-ico="engrenage" aria-label="À propos du portail" title="À propos du portail"></button>
</div>

<main class="portail">

  <!-- L'entrée : tout est centré sous le logo. -->
  <header class="entree">
    <div class="embleme" id="embleme"></div>
    <h1 class="titre-portail" id="titrePortail">Outils B27</h1>
    <p class="devise" id="devise"></p>
    <div class="quete noprint" id="quete" hidden>
      <span class="quete-loupe" data-ico="recherche" data-ico-taille="18" aria-hidden="true"></span>
      <input id="champRecherche" type="search" autocomplete="off" spellcheck="false"
             placeholder="Rechercher un outil, une ressource…" aria-label="Rechercher dans le portail">
      <kbd class="quete-touche" aria-hidden="true">/</kbd>
    </div>
    <p class="compte" id="compte"></p>
  </header>

  <!-- Les tuiles vivantes : météo en données réelles, calendrier en
       semaines ISO. Construites par hub.js. -->
  <section class="tuiles-vives noprint" id="tuilesVives" aria-label="Météo et calendrier">
    <article class="tuile-vive" id="tuileMeteo" hidden></article>
    <article class="tuile-vive" id="tuileCalendrier"></article>
  </section>

  <!-- Les rayons du portail, construits depuis catalogue.js. -->
  <section class="rayon" id="rayonOutils" hidden>
    <h2>Nos outils <span>fabriqués ici</span></h2>
    <div class="grille-outils" id="grilleOutils"></div>
  </section>

  <section class="rayon" id="rayonRessources" hidden>
    <h2>Ressources <span>sites de référence</span></h2>
    <div id="groupesRessources"></div>
  </section>

  <section class="rayon" id="rayonContact" hidden>
    <h2>Contact</h2>
    <div class="grille-contact" id="grilleContact"></div>
  </section>

  <p class="rien" id="rienTrouve" hidden></p>

</main>

<dialog id="dlgApropos" class="modale noprint" aria-labelledby="dlgAproposTitre">
  <div class="modale-tete">
    <h2 id="dlgAproposTitre" data-ico="engrenage" data-ico-taille="15">À propos du portail</h2>
    <span class="espace"></span>
    <button type="button" class="bouton-icone" id="btnAproposFermer" data-ico="fermer" aria-label="Fermer"></button>
  </div>
  <div class="modale-corps" id="aproposCorps"></div>
</dialog>

<script src="catalogue.js"></script>
<script src="signalement.js"></script>
<script src="hub.js"></script>
</body>
</html>
