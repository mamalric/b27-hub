<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outils B27</title>

<!-- Le hub n'a pas vocation à être trouvé par un moteur de recherche : il se
     transmet par son lien, entre collègues. Un site statique ne peut pas être
     réellement protégé par mot de passe, mais il peut au moins ne pas être
     référencé. robots.txt porte la même consigne côté serveur. -->
<meta name="robots" content="noindex, nofollow">

<meta name="description" content="Le hall d'entrée des outils et applications du bureau d'études B27.">
<meta property="og:type" content="website">
<meta property="og:title" content="Outils B27">
<meta property="og:description" content="Le hall d'entrée des outils et applications du bureau d'études B27.">

<link rel="icon" href="logo-b27.svg">

<link rel="stylesheet" href="hub.css">

<!-- Thème posé avant le premier rendu : sans cette ligne, un poste réglé en
     sombre verrait la page blanche un instant avant de basculer. -->
<script>try{var t=localStorage.getItem('hub_b27_theme');document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(e){}</script>
</head>

<body>

<header>
  <span class="logo" id="enteteLogo"></span>
  <div class="titre">
    <h1 id="titreHub">Outils B27</h1>
    <span class="sub" id="sousTitreHub"></span>
  </div>
  <span class="espace"></span>
  <button type="button" class="bouton-icone noprint" id="btnTheme" aria-label="Changer de thème"></button>
  <button type="button" class="bouton-icone noprint" id="btnApropos" data-ico="engrenage" aria-label="À propos du hub" title="À propos du hub"></button>
</header>

<!-- Bandeau d'accueil. Logo, accroche et compte des portes ouvertes sont
     posés par hub.js depuis les réglages du catalogue. -->
<section class="hall">
  <div class="hall-dedans">
    <span class="hall-logo" id="hallLogo"></span>
    <div class="hall-mots">
      <p class="hall-accroche" id="hallAccroche" hidden></p>
      <p class="hall-chapeau" id="hallChapeau" hidden></p>
    </div>
    <ul class="hall-chiffres" id="hallChiffres"></ul>
  </div>
</section>

<div class="wrap">
  <!-- Barre de recherche : construite par hub.js seulement au-delà de
       REGLAGES.seuilFiltres portes, elle reste vide en dessous. -->
  <div class="barre noprint" id="barre"></div>

  <!-- Fil d'Ariane, vide au niveau du hall. -->
  <div id="filAriane"></div>

  <!-- Dossiers ou portes, selon l'endroit où l'on est dans l'arborescence.
       Tout est construit à partir de catalogue.js, rien à écrire ici. -->
  <div id="contenu"></div>
</div>

<footer class="pied">
  <span id="piedCompte"></span>
  <span class="sep">|</span>
  <span>Le hub ne fait que rediriger : il ne collecte rien et n'enregistre que votre choix de thème.</span>
  <br>
  <span id="piedContact"></span>
</footer>

<dialog id="dlgApropos" class="modale noprint" aria-labelledby="dlgAproposTitre">
  <div class="modale-tete">
    <h2 id="dlgAproposTitre" data-ico="engrenage" data-ico-taille="15">À propos du hub</h2>
    <span class="espace"></span>
    <button type="button" class="bouton-icone" id="btnAproposFermer" data-ico="fermer" aria-label="Fermer"></button>
  </div>
  <div class="modale-corps" id="aproposCorps"></div>
</dialog>

<!-- catalogue.js d'abord : hub.js le lit au chargement.
     signalement.js est autonome et n'a besoin de rien d'autre ; il pose la
     pastille de signalement, en bas à droite. Le retirer ne casse rien. -->
<script src="catalogue.js"></script>
<script src="signalement.js"></script>
<script src="hub.js"></script>
</body>
</html>
